name: "push_pr"

on:
  push:
    branches:
      - main
      - "adjust-project"
  pull_request:
    branches:
      - "adjust-project"
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    
    env:
      PORT: '9090'
      DB_USER: 'postgres'
      DB_PASSWORD: 'password123'
      DB_NAME: 'reservation_db'
      DB_HOST: 'localhost'
      DB_PORT:  '5430'
      JWT_SECRET: 'super_secret_key_2026'

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Set up Node.js"
        uses: actions/setup-node@v4 # يفضل استخدام v4 للتوافق
        with:
          node-version: "18"
      
      - name: "Install dependencies"
        run: npm ci

      - name: "Generate .env file for dotenvx"
        run: |
          echo "PORT=${{ env.PORT }}" >> .env
          echo "DB_USER=${{ env.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ env.DB_PASSWORD }}" >> .env
          echo "DB_NAME=${{ env.DB_NAME }}" >> .env
          echo "DB_HOST=${{ env.DB_HOST }}" >> .env
          echo "DB_PORT=${{ env.DB_PORT }}" >> .env
          echo "JWT_SECRET=${{ env.JWT_SECRET }}" >> .env

      - name: "Run tests"
        run: npm test

