name: "push_pr"

on:
  push:
    branches:
      - main
      - "adjust-project"
  pull_request:
    branches:
      - "adjust-project"
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Set up Node.js"
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      
      - name: "Install dependencies"
        run: npm install jest

      - name: "Run tests"
        run: npm test

