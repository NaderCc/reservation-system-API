name: "push_pr"

on:
  push:
    branches:
      - main
      - "adjust-project"
  pull_request:
    branches:
      - "adjust-project"
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    
    env:
      PORT: '9090'
      DB_USER: 'postgres'
      DB_PASSWORD: 'password123'
      DB_NAME: 'reservation_db'
      DB_HOST: 'localhost'
      DB_PORT:  5430
      JWT_SECRET: 'super_secret_key_2026'
      
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Set up Node.js"
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      
      - name: "Install dependencies"
        run: npm ci

      - name: "Run tests"
        run: npm test

