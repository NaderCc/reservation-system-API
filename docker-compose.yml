version: '3.9'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: reservation_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      POSTGRES_DB: ${DB_NAME:-reservation_db}
    ports:
      - "5430:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-reservation_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    container_name: reservation_api
    ports:
      - "9090:9090"
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      DB_HOST: postgres_db 
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password123}
      DB_NAME: ${DB_NAME:-reservation_db}
      DB_PORT: 5432

volumes:
  pgdata: